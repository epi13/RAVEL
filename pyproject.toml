[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ravel-memory"
version = "0.1.0"
description = "Provenance-preserving memory consolidation primitives for RAVEL"
requires-python = ">=3.11"
authors = [{name = "RAVEL contributors"}]
dependencies = []

[project.scripts]
ravel-fabric-agent = "ravel.fabric_agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/ravel/ravel_versions/0.5" = ["ravel_versions/0.5/ravel-0.5-preregistration.json"]
"share/ravel/ravel_versions/0.6" = [
  "ravel_versions/0.6/ravel-0.6-preregistration.json",
  "ravel_versions/0.6/ravel-0.6-preregistration.schema.json",
  "ravel_versions/0.6/ravel-0.6-transaction.schema.json",
  "ravel_versions/0.6/ravel-0.6-matched-compute.schema.json",
  "ravel_versions/0.6/ravel-0.6-fabric-observation.schema.json",
  "ravel_versions/0.6/ravel-0.6-family-compatibility-lock.json",
]
"share/ravel/schemas" = [
  "schemas/ravel-rust-foundation.schema.json",
  "schemas/ravel-interchange.schema.json",
  "schemas/ravel-knowledge-record.schema.json",
  "schemas/consolidation-proposal.schema.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
