name: Import RAVEL from MNCS

on:
  push:
    branches:
      - agent/import-ravel-foundation

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out RAVEL branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import RAVEL source and research records
        shell: bash
        run: |
          set -euo pipefail
          source_commit='c521d47441905b36fc581a1c10e88282c6163f09'
          git clone --no-checkout https://github.com/epi13/machine-native-complexity-standard.git /tmp/mncs
          git -C /tmp/mncs checkout "$source_commit"

          cp -a /tmp/mncs/case-studies/ravel/. ./

          mkdir -p research studies
          cp /tmp/mncs/docs/recursive-experience-substrate.md research/recursive-experience-substrate.md
          cp /tmp/mncs/docs/recursive-architecture-research.md research/recursive-architecture-research.md
          cp -a /tmp/mncs/studies/recursive-experience-substrate studies/
          cp -a /tmp/mncs/studies/recursive-architecture-comparison studies/

          cat > MIGRATION_ORIGIN.md <<'EOF'
          # Migration origin

          This repository began as a standalone extraction of the RAVEL research project from `epi13/machine-native-complexity-standard`.

          - Source repository: `epi13/machine-native-complexity-standard`
          - Source commit: `c521d47441905b36fc581a1c10e88282c6163f09`
          - Imported executable tree: `case-studies/ravel/`
          - Additional imported research: recursive architecture and recursive experience/causal-learning studies

          The first standalone import intentionally preserves the RAVEL files and evidence artifacts before larger architectural changes. The MNCS repository remains the historical source of the pre-extraction commit record.
          EOF

          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'EOF'
          name: RAVEL CI

          on:
            push:
            pull_request:

          permissions:
            contents: read

          jobs:
            core:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Install compilers
                  run: sudo apt-get update && sudo apt-get install -y clang gcc make
                - name: Run RAVEL verification
                  run: make all
                - name: Run recursive experience substrate checks
                  run: |
                    python3 studies/recursive-experience-substrate/validate_substrate.py
                    python3 studies/recursive-experience-substrate/test_validate_substrate.py
                - name: Run recursive architecture study checks
                  run: |
                    python3 studies/recursive-architecture-comparison/validate_study.py
                    python3 studies/recursive-architecture-comparison/test_validate_study.py
                - name: Check whitespace
                  run: git diff --check
          EOF

          rm -f .github/workflows/import-ravel.yml

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import RAVEL project from MNCS'
          git push origin HEAD:agent/import-ravel-foundation
